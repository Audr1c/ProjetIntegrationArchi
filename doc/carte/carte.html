ation\n\nDeux idées pour rendre la descente moins dépendante du hasard et faire baisser le nombre de bits final :\n\n1. un **ordre des variables pondéré par leur poids** (déterministe, ou tiré au hasard avec des probabilités proportionnelles au poids) ;\n2. un **seuil de précision croissant au fil des passes** (0 point de perte toléré au début, puis on relâche petit à petit jusqu'au seuil max).\n\n## Constat de départ (12 runs, k=5, seuil 1 pt, 1000 images)\n\nSources : …", "genre": "md", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/Exploration/pistes_prochaine_exploration.md"}, {"id": "Exploration/validate.py", "titre": "validate.py", "groupe": "explo", "role": "Teste des configs sur test_batch / autres batches", "desc": "Teste une ou plusieurs configurations virgule fixe sur beaucoup d'images et sur d'autres batches.", "genre": "py", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/Exploration/validate.py"}, {"id": "ExplorationHLS/README.md", "titre": "README.md", "groupe": "explohls", "role": "Mode d'emploi à l'école, seuils, méthode, premier run", "desc": "# ExplorationHLS : exploration automatique des directives Catapult\n\nCherche une configuration de directives (pipeline, déroulage, mémoires) selon l'un des deux objectifs (`--goal`) :\n\n- `cost` (défaut) : la configuration **la moins coûteuse** dont la latence tient la cible ;\n- `perf` : la configuration **la plus rapide** (latence + débit) qui tient tous les budgets, débarrassée ensuite\n  de ce qui ne sert pas. Ce run garde aussi la moins chère sous la cible (`cheapest_directives.tcl`).\n\nLe …", "genre": "md", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/ExplorationHLS/README.md"}, {"id": "ExplorationHLS/explore_hls.py", "titre": "explore_hls.py", "groupe": "explohls", "role": "Point d'entrée : run, base, list, show, plot, tcl (--fake)", "desc": guration retenue (hls/cnn.tcl + hls/sim_rtl.sh).", "genre": "py", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/ExplorationHLS/hlsexplo/limits.py"}, {"id": "ExplorationHLS/hlsexplo/model.py", "titre": "model.py", "groupe": "explohls", "role": "Modèle analytique latence / ressources, recalé sur Catapult", "desc": "Modèle analytique (gratuit) de la latence et des ressources d'une configuration.", "genre": "py", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/ExplorationHLS/hlsexplo/model.py"}, {"id": "ExplorationHLS/hlsexplo/paths.py", "titre": "paths.py", "groupe": "explohls", "role": "Chemins, carte XC7Z020, empreinte du code", "desc": "Chemins, cible FPGA et fichiers dont dépend une synthèse.", "genre": "py", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/ExplorationHLS/hlsexplo/paths.py"}, {"id": "ExplorationHLS/hlsexplo/plots.py", "titre": "plots.py", "groupe": "explohls", "role": "pareto.png, evolution.png", "desc": "Graphes PNG d'un run (matplotlib sans interface : Figure + Agg, utilisable depuis un thread).\n\n    pareto.png     toutes les évaluations dans le plan latence / coût, chemin suivi fléché,\n                   cible en pointillés, zone « trop lent » grisée ; ronds creux = prédictions du modèle\n    evolution.png  pour chaque pas retenu : latence empilée par bloc (cible en pointillés) et\n                   ressources en % du budget (BRAM, DSP, LUT), slack en légende", "genre": "py", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/ExplorationHLS/hlsexplo/plots.py"}, {"id": "ExplorationHLS/hlsexplo/report.py", "titre": "report.py", "groupe": "explohls", "role": "summary.json, best_directives.tcl, tableau du chemin", "desc": "Fin de run : summary.json, best_directives.tcl, tableau du chemin suivi (aussi pour « show »).", "genre": "py", "fichier": c/Phelma/S9%20SEI/AlgoArchi/TP/README.md"}, {"id": "cpp/CMakeLists.txt", "titre": "CMakeLists.txt", "groupe": "cpp", "role": "Construit main, main_raw, tb_hls", "desc": "", "genre": "cmake", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/cpp/CMakeLists.txt"}, {"id": "cpp/cnn.cpp", "titre": "cnn.cpp", "groupe": "cpp", "role": "Top synthétisable cnn() : 3 conv + pools + perceptron, ROM", "desc": "ROM des coefficients ker1, bia1, ..., fck, fcb : trois façons de les compiler.\n\n1) CNN_ROM_RAW (défaut en synthèse, ou -DCNN_ROM_RAW sur PC pour le tester) : coeffs_kK_raw.hpp,\n   GÉNÉRÉ par hls/gen_coeffs.py dans les formats de config.hpp (#error s'ils ont changé depuis :\n   relancer make coeffs) : static const RomWord<type> nom[taille] = {entiers}; -> ROM.\n   Valeurs déjà quantifiées (floor(x * 2^F) replié sur W bits = ac_fixed(double) en AC_TRN/AC_WRAP),\n   lues par rom_value() (utils.hpp). Un tableau d'entiers natifs se compile ~20x plus vite que\n   74 000 constructeurs ac_fixed : c'est ce qui faisait durer go analyze 17 min.\n2) __SYNTHESIS__ avec -DCNN_ROM_DOUBLE (ancienne méthode, secours) : static const <type> nom[taille]\n   = {double...}; conversion double -> ac_fixed faite par l'outil (lent).\n3) PC (défaut) : coeffs_kK.hpp, les mêmes littéraux dans un tableau double, convertis …", "genre": "cpp", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/cpp/cnn.cpp"}, {"id": "cpp/cnn.hpp", "titre": "cnn.hpp", "groupe": "cpp", "role": "Dimensions du réseau, KS, prototype du top cnn()", "desc": "CNN CIFAR-10 complet (voir python/cnn.py)\n    24x24x3 -conv1+relu-> 24x24x64 -pool 3x3/2-> 12x12x64\n            -conv2+relu-> 12x12x32 -pool 3x3/2-> 6x6x32\n            -conv3+relu-> 6x6x20   -pool 3x3/2-> 3x3x20\n            -flatten(HWC)-> 180 -perceptron-> 10\n\nFormats virgule fixe : config.hpp. Dimensions : ici (config.hpp est regénéré par Exploration/).", "genre": "hpp", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/cpp/cnn.hpp"}, {"id": "cpp/coeffs_k3.hpp", "titre": "coeffs_k3.hpp", "groupe": "cpp", "role": "ROM 3x3 en double (PC) — GÉNÉRÉ", "desc": "", "genre": "hpp", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/cpp/coeffs_k3.hpp"}, {"id": "cpp/coeffs_k3_raw.hpp", "titre": "coeffs_k3_raw.hpp", "groupe": "cpp", "role": "ROM 3x3 entières quantifiées (synthèse) — GÉNÉRÉ", "desc": "Coefficients du CNN, noyaux 3x3, DÉJÀ QUANTIFIÉS : ROM de cnn() en synthèse (CNN_ROM_RAW).\nFICHIER GÉNÉRÉ par hls/gen_coeffs.py depuis data/coef/CNN_coeff_3x3.txt et cpp/config.hpp : ne pas modifier à la main.\nFormats <W,I> : K1<12,3> B1<13,3> K2<10,1> B2<6,3> K3<11,2> B3<8,3> FCK<5,-1> FCB<7,3>\nChaque entier = motif binaire de ac_fixed<W, I, true>(x) (AC_TRN, AC_WRAP), lu par rom_value().\nMême rangement que coeffs_k*.hpp. À inclure DANS le corps d'un bloc de cpp/cnn.cpp ;\nCNN_ROM_LAYER = n (défini avant l'#include) ne déclare que les ROM de la couche n.", "genre": "hpp", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/cpp/coeffs_k3_raw.hpp"}, {"id": "cpp/coeffs_k5.hpp", "titre": "coeffs_k5.hpp", "groupe": "cpp", "role": "ROM 5x5 en double (PC) — GÉNÉRÉ", "desc": "", "genre": "hpp", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/cpp/coeffs_k5.hpp"}, {"id": "cpp/coeffs_k5_raw.hpp", "titre": "coeffs_k5_raw.hpp", "groupe": "cpp", "role": "ROM 5x5 entières quantifiées (synthèse) — GÉNÉRÉ", "desc": "", "genre": "hpp", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/cpp/coeffs_k5_raw.hpp"}, {"id": "cpp/config.hpp", "titre": "config.hpp", "groupe": "cpp", "role": "TOUS les formats ac_fixed<W,I> (surchargeables par -D)", "desc": "Formats virgule fixe du CNN : ac_fixed<W, I, S>\n    W : nombre total de bits\n    I : bits de partie entière (signe compris si signé)\n\nGénéré par Exploration/explore.py le 2026-11-25 15:29\nexploration 20261119-223144_k5_t1_s5949 : 88.10 % sur 1000 images, noyau 5x5\n\nToutes les valeurs se modifient ici, ou à la compilation sans toucher au code :\n    cmake -DCMAKE_CXX_FLAGS=\"-DCONV1_W=12 -DCONV1_I=6\" ..", "genre": "hpp", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/cpp/config.hpp"}, {"id": "cpp/main.cpp", "titre": "main.cpp", "groupe": "cpp", "role": "Programme PC : précision sur N images, --trace, --dump", "desc": "Affiche un format \"nom  <W,I,S>\"", "genre": "cpp", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/cpp/main.cpp"}, {"id": "cpp/read_image.cpp", "titre": "read_image.cpp", "groupe": "cpp", "role": "Lecture CIFAR + rognage + normalisation (double)", "desc": "", "genre": "cpp", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/cpp/read_image.cpp"}, {"id": "cpp/read_image.hpp", "titre": "read_image.hpp", "groupe": "cpp", "role": "Interface de read_image.cpp", "desc": "Lecture des fichiers binaires CIFAR-10 (*.bin)\nÉquivalent C++ de python/read_image.py\n\nUn enregistrement fait 3073 octets :\n    [1 octet : label 0..9][1024 octets R][1024 octets G][1024 octets B]\nChaque plan fait 32x32, rangé ligne par ligne.\n\nL'image est rognée au centre (24x24) puis normalisée :\n    x' = (x - moyenne) / max(écart-type, 1/sqrt(24*24*3))\nLa sortie est rangée en [canal][ligne][colonne] (ordre des feature maps du modèle).", "genre": "hpp", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/cpp/read_image.hpp"}, {"id": "cpp/tb_common.hpp", "titre": "tb_common.hpp", "groupe": "cpp", "role": "Signature des formats, lecture/écriture des scores de réf.", "desc": "Outils communs aux testbenchs (main.cpp --dump, hls/tb_hls.cpp) — PAS synthétisable.\n\nFichier de scores de référence (hls/ref/scores_kK.txt, voir hls/AUDIT_HLS.md C-06) :\n    # formats KS=5 in=16,4 ker1=16,3 ...      <- signature : formats avec lesquels il a été produit\n    <indice image> <score 0> ... <score 9>     <- une ligne par image, 17 chiffres (valeur exacte)\nLes scores ne sont comparables qu'à formats identiques : la signature le vérifie.", "genre": "hpp", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/cpp/tb_common.hpp"}, {"id": "cpp/utils.cpp", "titre": "utils.cpp", "groupe": "cpp", "role": "Corps des templates (inclus par utils.hpp)", "desc": "Toutes les boucles sont nommées (AUDIT_HLS D-07) : les directives Catapult les visent par ces labels,\nex. /cnn/core/<instance de convolution_feature>:MAC_N (noms exacts : section Loops de cycle.rpt).\nUn label a la portée de la fonction : il doit être unique dans chaque fonction, pas dans le projet.", "genre": "cpp", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/cpp/utils.cpp"}, {"id": "cpp/utils.hpp", "titre": "utils.hpp", "groupe": "cpp", "role": "Briques templates : conv, relu, pool, perceptron, RomWord", "desc": "Briques du CNN, écrites pour être synthétisables par Catapult (voir hls/AUDIT_HLS.md) :\n  - tableaux C de taille fixe, pas de std::vector ni d'allocation dynamique    (A-02)\n  - dimensions en paramètres template -> bornes de boucles constantes          (A-03, B-01)\n  - résultats écrits dans un tableau passé en paramètre, pas de retour         (A-04)\n\nRangement des données :\n  feature map : [C][H][W]           -> x[(c*H + r)*W + k]\n  noyau       : [C_out][C_in][K][K] -> ker[((co*C_in + ci)*K + m)*K + n]\n  matrice FC  : [M][N] ligne par ligne -> mat[k*N + j]\n\nac_fixed parameters:\nW: total width in bits\nI: width of integer part\nS: true for signed, false for unsigned", "genre": "hpp", "fichier": true, "documente": true, "lien": "vscode://file/home "hls/catapult_report.py", "titre": "catapult_report.py", "groupe": "hls", "role": "Lit rtl.rpt / cycle.rpt / sim.log → résumé Markdown, JSON", "desc": "Résumé des résultats Catapult SANS interface graphique : lit les rapports texte d'une ou plusieurs\nsolutions et produit un tableau Markdown (et/ou JSON) : latence, débit, surface, DSP, LUT, slack,\nmémoires (estimation BRAM), boucles les plus coûteuses, verdict SCVerify.", "genre": "py", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/hls/catapult_report.py"}, {"id": "hls/cnn.tcl", "titre": "cnn.tcl", "groupe": "hls", "role": "Script Catapult complet : analyse → RTL → SCVerify → rapports", "desc": "Synthese HLS du CNN CIFAR-10 avec Catapult - voir hls/AUDIT_HLS.md (C-02, C-03)\nModele : hls/Demo_FIR/demo_sim.tcl et hls/demoFir.tcl\nUsage (machine de l'ecole) :\nsource hls/bash_mentor_24               # environnement Catapult / Questa / Precision\nmkdir -p hls/work && cd hls/work        # dossier de travail (ignore par git : work/)\ncatapult -shell -file ../cnn.tcl        # ou, dans la GUI : File > Run Script... > hls/cnn.tcl\nCloner le depot dans un chemin SANS ESPACE : les Makefiles generes par SCVerify ne les\nsupportent pas de facon fiable (le chemin local \" S9 SEI \" en contient une).\nLe script s'arrete apres la generation du RTL et la verification SCVerify. Les directives\nd'architecture (pipeline, unroll, memoires : partie D de l'audit) viennent ensuite.\nDurees constatees (2026-11-24, Catapult 2024.2) : go analyze ~ 17 min avec les ROM en ac_fixed\ninitialises par des double, tout le …", "genre": "tcl", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/hls/cnn.tcl"}, {"id": "hls/cnn_report.tcl", "titre": "cnn_report.tcl", "groupe": "hls", "role": "Procédures cnn_report, cnn_summary, cnn_sim_cmd, cnn_sim_env", "desc": "Procedures Tcl de recuperation des resultats Catapult SANS GUI (source par hls/cnn.tcl).\nApres \" project load \" dans une nouvelle session : source ../cnn_report.tcl  (depuis hls/work/)\ncnn_report    copie rtl.rpt, cycle.rpt, messages.txt, directives.tcl, sim.log, catapult.log de la\nsolution active dans hls/rapports/<solution>_<date>/ et y ecrit resume.md\n(hls/catapult_report.py : latence, surface, memoires, boucles, verdict SCVerify)\ncnn_summary   resume de TOUTES les solutions du projet (tableau comparatif), sans rien copier\ncnn_sim_cmd   affiche la commande shell de la simulation RTL en tache de fond (hls/sim_rtl.sh,\navec compteur de cycles hls/sim_progress.tcl)\ncnn_sim_env   pose les variables du compteur de cycles (pour une simulation lancee DANS Catapult)", "genre": "tcl", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/hls/cnn_report.tcl"}, {"id": "hls/demoFir.tcl", "titre": "demoFir.tcl", "groupe": "hls", "role": "Script de la démo FIR de l'encadrant", "desc": "", "genre": "tcl", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/hls/demoFir.tcl"}, {"id": "hls/gen_coeffs.py", "titre": "gen_coeffs.py", "groupe": "hls", "role": "data/coef → ROM C++ (double et entières quantifiées)", "desc": "Génère les ROM de coefficients du CNN pour la HLS : cpp/coeffs_k3.hpp et cpp/coeffs_k5.hpp\n(nombres du fichier, indépendants des formats), et cpp/coeffs_k3_raw.hpp, coeffs_k5_raw.hpp\n(entiers déjà quantifiés dans les formats de cpp/config.hpp : utilisés en synthèse).", "genre": "py", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/hls/gen_coeffs.py"}, {"id": "hls/ref/images_200.bin", "titre": "images_200.bin", "groupe": "donnees", "role": "200 premières images de data_batch_1 (versionnées)", "desc": "", "genre": "donnée", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/hls/ref/images_200.bin"}, {"id": "hls/ref/scores_k3.txt", "titre": "scores_k3.txt", "groupe": "donnees", "role": "Scores exacts de 200 images (3x3)", "desc": "formats KS=3 in=16,4 ker1=16,3 bias1=16,4 acc1=0,0 conv1=16,8 pool1=16,8 ker2=16,3 bias2=16,4 acc2=0,0 conv2=16,8 pool2=16,8 ker3=16,3 bias3=16,4 acc3=0,0 conv3=16,8 pool3=16,8 fck=16,1 fcb=16,3 accfc=0,0 out=16,8", "genre": "donnée", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/hls/ref/scores_k3.txt"}, {"id": "hls/ref/scores_k5.txt", "titre": "scores_k5.txt", "groupe": "donnees", "role": "Scores exacts de 200 images (5x5) : référence bit-exacte", "desc": "formats KS=5 in=15,4 ker1=12,3 bias1=13,3 acc1=14,5 conv1=9,5 pool1=8,4 ker2=10,1 bias2=6,3 acc2=18,8 conv2=8,8 pool2=5,5 ker3=11,2 bias3=8,3 acc3=15,9 conv3=10,9 pool3=7,6 fck=5,-1 fcb=7,3 accfc=13,6 out=7,6", "genre": "donnée", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/hls/ref/scores_k5.txt"}, {"id": "hls/sim_progress.tcl", "titre": "sim_progress.tcl", "groupe": "hls", "role": "Compteur de cycles dans vsim : %, image, temps restant", "desc": "Compteur de cycles pendant la simulation RTL SCVerify sous Questa (vsim), en mode batch.\nASCII seulement : vsim et Catapult affichent mal les accents.\nSource par le script vsim de SCVerify (scverify_msim_wave.tcl) AVANT do_simulation_run, grace a\nla variable make QuestaSIM_MSIM_DOFILE (voir cnn_sim_cmd dans hls/cnn_report.tcl). La simulation\navance par tranches de CNN_SIM_STEP cycles ; apres chaque tranche une ligne :\n[sim] cycle 1200000 / 46123242 (2.6 %) | image 1/1 | 0:01:05 | 18461 cycles/s | reste ~ 0:40:31\nFin : quand le temps simule n'avance plus (sc_stop du testbench), on rend la main a SCVerify\n(do_simulation_run : run -all immediat, verdict PASSED/FAILED, quit).\nVariables d'environnement (posees par cnn_sim_cmd) :\nCNN_CLOCK_NS     periode d'horloge en ns (defaut 10)\nCNN_SIM_CYCLES   cycles attendus au total (latence x images, lue dans rtl.rpt) : %, image, temps …", "genre": "tcl", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/hls/sim_progress.tcl"}, {"id": "hls/sim_rtl.sh", "titre": "sim_rtl.sh", "groupe": "hls", "role": "Simulation RTL Questa hors Catapult, en tâche de fond", "desc": "Simulation RTL SCVerify (Questa) d'une solution Catapult, HORS de Catapult, avec compteur de cycles.\nMessages en ASCII (Catapult / vsim affichent mal les accents).\nUsage (machine de l'ecole, en tache de fond) :\nnohup hls/sim_rtl.sh hls/work/Catapult_1/cnn.v1 [nb_images=1] [cycles_par_ligne=100000] \\\n> hls/work/Catapult_1/cnn.v1/sim_rtl.out 2>&1 &\ntail -f hls/work/Catapult_1/cnn.v1/sim_rtl.out | grep --line-buffered -E \"\\[sim\\]|PASSED|FAILED|Error|image \"\n- latence (cycles/image) et periode d'horloge lues dans <solution>/rtl.rpt -> %, image en cours, temps restant\n- hls/sim_progress.tcl est passe a vsim par QuestaSIM_MSIM_DOFILE (fichier utilisateur de SCVerify) ;\nsecours : ajoute directement dans scverify_msim_wave.tcl s'il existe deja sans lui\n- QuestaSIM_SUPPRESS_WAVEFORMS=true : pas de traces (vsim.wlf), simulation plus rapide\n- a la fin : hls/catapult_report.py --save hls/rapports …", "genre": "sh", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/hls/sim_rtl.sh"}, {"id": "hls/stub/ac_channel.h", "titre": "ac_channel.h", "groupe": "hls", "role": "ac_channel minimal (FIFO) pour compiler cnn.cpp sur PC", "desc": "Remplacement MINIMAL de ac_channel.h (fourni par Catapult dans $MGC_HOME/shared/include),\nuniquement pour compiler le modèle C++ sur un PC sans Catapult (cibles CMake, Exploration/).\nSous Catapult, ce dossier n'est PAS dans le chemin d'include : c'est le vrai fichier qui est utilisé.\nÉcrit pour ce projet (n'est pas une copie du fichier de Siemens). Si hls/include/ contient un jour le\nvrai ac_channel.h (copié depuis l'école), il passe avant celui-ci (ordre des -I).\n\nSémantique reprise : FIFO non bornée ; read() sur un canal vide est une erreur fatale\n(le vrai ac_channel lève une exception) ; un canal ne se copie pas.", "genre": "h", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/hls/stub/ac_channel.h"}, {"id": "hls/stub/mc_scverify.h", "titre": "mc_scverify.h", "groupe": "hls", "role": "Faux mc_scverify.h pour compiler tb_hls sur PC", "desc": "Remplacement MINIMAL de mc_scverify.h (fourni par Catapult dans $MGC_HOME/shared/include),\nuniquement pour compiler et lancer hls/tb_hls.cpp sur un PC sans Catapult (cible CMake tb_hls).\nSous Catapult, ce dossier n'est PAS dans le chemin d'include : c'est le vrai fichier qui est utilisé.\nÉcrit pour ce projet (n'est pas une copie du fichier de Siemens).", "genre": "h", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/hls/stub/mc_scverify.h"}, {"id": "hls/tb_hls.cpp", "titre": "tb_hls.cpp", "groupe": "hls", "role": "Testbench SCVerify : N images, compare aux scores de réf.", "desc": "Testbench SCVerify de la fonction top cnn() — voir hls/AUDIT_HLS.md C-01, C-06, C-07, C-08.\nExclu de la synthèse (hls/cnn.tcl : -exclude true), comme FIR_TESTBENCH.cpp dans hls/Demo_FIR/.\n\nPour chaque image (indices 0..N-1 de hls/ref/images_200.bin = les 200 premières de data_batch_1,\nversionnées : data/ est ignoré par git et absent d'un clone neuf, ex. sur les machines de l'école) :\n  lecture + rognage + normalisation (read_image.cpp, en double) -> input_t image[1728]\n  CCS_DESIGN(cnn)(image, scores)\n  affichage des scores, de la classe prédite et du label ;\n  comparaison exacte aux scores de référence hls/ref/scores_kK.txt (produits par cpp/build/main --dump)\n  si ce fichier a été produit avec les mêmes formats (ligne de signature identique).\n\nSous SCVerify, Catapult compare en plus automatiquement les sorties du RTL à celles du C++.\n\nVariables d'environnement :\n  CNN_ROOT  racine du …", "genre": "cpp", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/hls/tb_hls.cpp"}, {"id": "python/amplitude.py", "titre": "amplitude.py", "groupe": "python", "role": "Histogramme log2 des valeurs → propose ac_fixed", "desc": "Mesure de la dynamique des valeurs du CNN pour choisir les ac_fixed<W, I, S>.", "genre": "py", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/python/amplitude.py"}, {"id": "python/cnn.py", "titre": "cnn.py", "groupe": "python", "role": "CNN en boucles Python : modèle « matériel », lent", "desc": "", "genre": "py", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/python/cnn.py"}, {"id": "python/cnn_fast.py", "titre": "cnn_fast.py", "groupe": "python", "role": "Même CNN vectorisé numpy (~1000x plus rapide)", "desc": "Version vectorisée (numpy) du CNN CIFAR-10.\n\nMême réseau que cnn.py, mais sans boucles Python sur les pixels :\n~1000x plus rapide, utilisable pour mesurer la précision sur un batch complet.\ncnn.py reste le modèle de référence « boucles » qui servira pour le C++/HLS.\n\nFormat : NHWC (N images, H lignes, W colonnes, C canaux).", "genre": "py", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/python/cnn_fast.py"}, {"id": "python/extractCoeff.py", "titre": "extractCoeff.py", "groupe": "python", "role": "Lit les coefficients texte (data/coef)", "desc": "", "genre": "py", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/python/extractCoeff.py"}, {"id": "python/main.py", "titre": "main.py", "groupe": "python", "role": "Évalue le CNN Python sur N images, mesure la dynamique", "desc": "", "genre": "py", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/python/main.py"}, {"id": "python/read_image.py", "titre": "read_image.py", "groupe": "python", "role": "Lecture CIFAR binaire, rognage, normalisation", "desc": "Lecture des fichiers binaires CIFAR-10 (version « binary » : *.bin).\n\nFormat d'un batch : 10 000 enregistrements de 3073 octets chacun\n    [1 octet : label 0..9][1024 octets R][1024 octets G][1024 octets B]\nChaque plan couleur fait 32x32, rangé ligne par ligne (planar, pas entrelacé).\n\nLes images retournées sont rognées au centre (24x24) puis normalisées\nvia normalize().", "genre": "py", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/python/read_image.py"}, {"id": "python/utils.py", "titre": "utils.py", "groupe": "python", "role": "conv, relu, max-pool, MAC en boucles", "desc": "", "genre": "py", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/python/utils.py"}, {"id": "requirements-ecole.txt", "titre": "requirements-ecole.txt", "groupe": "donnees", "role": "Paquets Python bornés pour Python 3.8 (école)", "desc": "Machines de l'école : Python 3.8.10, pip 21.1.2, sans sudo  ->  make venv-ecole\nMêmes paquets que requirements.txt (inchangé, pour la machine perso), bornés aux dernières versions\nqui supportent Python 3.8. Testé avec Python 3.8 + pip 21.1.2 (venv neuf) le 2026-11-25.\nMinimum pour l'exploration HLS (ExplorationHLS/) : rich (tableau de bord) ; matplotlib pour les graphes.", "genre": "donnée", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/requirements-ecole.txt"}, {"id": "requirements.txt", "titre": "requirements.txt", "groupe": "donnees", "role": "Dépendances Python du venv", "desc": "Référence algorithmique du CNN CIFAR-10 (étape Python)", "genre": "donnée", "fichier": true, "documente": true, "lien": "vscode://file/home/audric/Phelma/S9%20SEI/AlgoArchi/TP/requirements.txt"}, {"id": "data:cifar", "titre": "data/cifar-10-batches-bin/", "groupe": "donnees", "role": "CIFAR-10 binaire (non versionné, ~180 Mo)", "desc": "6 fichiers de 10 000 images 32x32x3 : data_batc // ---------------------------------------------------------------- constantes
const W = 214, H = 48, GY = 14, VOIE = 300, MARGE = 43, HAUT = 64;
const NOMS_TYPES = { lance: "lance / exécute", importe: "importe", inclut: "inclut", lit: "lit",
  ecrit: "écrit / génère", depend: "dépend de", synthetise: "synthétise", pilote: "pilote" };
const SORTANT = { lance: "Lance / exécute", importe: "Importe", inclut: "Inclut", lit: "Lit",
  ecrit: "Écrit / génère", depend: "Dépend de", synthetise: "Synthétise", pilote: "Pilote" };
const ENTRANT = { lance: "Lancé par", importe: "Importé par", inclut: "Inclus par", lit: "Lu par",
  ecrit: "Écrit / généré par", depend: "Requis par", synthetise: "Synthétisé par", pilote: "Piloté par" };
const ICONES = { make: "$ ", "données": "◆ ", dossier: "▣ ", bin: "▶ ", ext: "⚙ " };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (parent) parent.appendChild(e); return e; };
const sansAccent = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const echappe = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------------------------------------------------------------- données
const parId = new Map(D.noeuds.map(n => [n.id, n]));
const voies = D.groupes.map((g, i) => ({ ...g, i, noeuds: [] }));
const voieDe = new Map(voies.map(v => [v.id, v]));
for (const n of D.noeuds) { (voieDe.get(n.groupe) || voies[voies.length - 1]).noeuds.push(n); n.sort = []; n.entre = []; }
for (const l of D.liens) { const s = parId.get(l.source), c = parId.get(l.cible);
  if (!s || !c) continue; l.s = s; l.c = c; s.sort.push(l); c.entre.push(l); }
const liens = D.liens.filter(l => l.s && l.c);
// « inclut » et « dépend de » masqués au départ (nombreux, peu parlants) : réactivables dans la légende
const typesActifs = new Set(D.types.filter(t => !["inclut", "depend"].includes(t)));
const etat = { choisi: null, survol: null, recherche: "", parcours: null, etape: 0 };

// ---------------------------------------------------------------- disposition
for (const v of voies) {
  v.x = MARGE + v.i * VOIE;
  v.noeuds.sort((a, b) => (a.genre === b.genre ? 0 : a.genre < b.genre ? -1 : 1) || a.id.localeCompare(b.id));
  v.noeuds.forEach((n, k) => { n.voie = v; n.x = v.x; n.y = HAUT + k * (H + GY); });
}
// barycentres : rapproche chaque nœud de ses voisins des autres colonnes (moins de croisements)
for (let passe = 0; passe < 12; passe++) {
  const ordre = passe % 2 ? [...voies].reverse() : voies;
  for (const v of ordre) {
    for (const n of v.noeuds) {
      const ys = [...n.sort.map(l => l.c), ...n.entre.map(l => l.s)].filter(m => m.voie !== v).map(m => m.y);
      n.cle = ys.length ? ys.reduce((a, b) => a + b, 0) / ys.length : n.y;
    }
    v.noeuds.sort((a, b) => a.cle - b.cle);
    v.noeuds.forEach((n, k) => { n.y = HAUT + k * (H + GY); });
  }
}
const hauteurMax = Math.max(...voies.map(v => v.noeuds.length)) * (H + GY) + HAUT + 30;

// points d'attache répartis sur le côté de chaque nœud
function cotes(l) {
  const vs = l.s.voie.i, vc = l.c.voie.i;
  if (vs < vc) return ["d", "g"]; if (vs > vc) return ["g", "d"]; return ["d", "d"];
}
function repartit() {
  const ports = new Map();
  for (const l of liens) { if (!typesActifs.has(l.type)) continue;
    const [cs, cc] = cotes(l);
    for (const [n, c, autre] of [[l.s, cs, l.c], [l.c, cc, l.s]]) {
      const k = n.id + c; if (!ports.has(k)) ports.set(k, []); ports.get(k).push({ l, n, autre }); } }
  for (const liste of ports.values()) {
    liste.sort((a, b) => a.autre.y - b.autre.y);
    liste.forEach((p, i) => { const y = p.n.y + H * (0.2 + 0.6 * (liste.length === 1 ? .5 : i / (liste.length - 1)));
      if (p.l.s === p.n) p.l.y1 = y; else p.l.y2 = y; });
  }
}
function chemin(l) {
  const [cs, cc] = cotes(l);
  const x1 = cs === "d" ? l.s.x + W : l.s.x, x2 = cc === "d" ? l.c.x + W : l.c.x;
  const y1 = l.y1 ?? l.s.y + H / 2, y2 = l.y2 ?? l.c.y + H / 2;
  if (cs === cc) { const dx = 36 + Math.min(120, Math.abs(y2 - y1) * .18);
    return `M${x1},${y1} C${x1 + dx},${y1} ${x2 + dx},${y2} ${x2 + 6},${y2}`; }
  const s = cs === "d" ? 1 : -1, dx = Math.max(50, Math.abs(x2 - x1) * .42);
  return `M${x1},${y1} C${x1 + s * dx},${y1} ${x2 - s * dx},${y2} ${x2 - s * 6},${y2}`;
}

// ---------------------------------------------------------------- dessin
const svg = document.getElementById("svg"), monde = document.getElementById("monde");
const gVoies = document.getElementById("voies"), gLiens = document.getElementById("liens"),
      gNoeuds = document.getElementById("noeuds"), gBadges = document.getElementById("badges"),
      gTrace = document.getElementById("trace"), gEtiq = document.getElementById("etiquettes");

function marqueurs() {
  const defs = document.getElementById("defs"); defs.innerHTML = "";
  for (const t of D.types) {
    const m = el("marker", { id: "fl-" + t, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7,
      orient: "auto-start-reverse" }, defs);
    el("path", { d: "M0,0 L10,5 L0,10 z", fill: css("--l-" + t) }, m);
  }
}
function dessineVoies() {
  gVoies.innerHTML = "";
  for (const v of voies) {
    el("rect", { class: "voie-fond", x: v.x - 18, y: 14, width: W + 36, height: hauteurMax, rx: 14 }, gVoies);
    el("rect", { x: v.x - 18, y: 14, width: W + 36, height: 5, rx: 2.5, fill: css("--g-" + v.id) }, gVoies);
    const t = el("text", { class: "voie-titre", x: v.x + W / 2, y: 44, "text-anchor": "middle" }, gVoies);
    t.textContent = v.titre;
  }
}
function coupe(s, n) { return s.length > n ? s.slice(0, n - 1) + "…" : s; }
function dessineNoeuds() {
  gNoeuds.innerHTML = "";
  for (const n of D.noeuds) {
    const g = el("g", { class: "noeud" + (n.documente ? "" : " non-doc"), transform: `translate(${n.x},${n.y})` }, gNoeuds);
    n.g = g;
    const ext = n.genre === "ext";
    el("rect", { class: "corps", width: W, height: H, rx: ext ? H / 2 : 9 }, g);
    if (!ext) el("rect", { x: 0, y: 0, width: 5, height: H, rx: 2.5, fill: css("--g-" + (n.voie?.id || "donnees")) }, g);
    const t = el("text", { class: "titre", x: ext ? 18 : 13, y: 20 }, g);
    const gen = /GÉNÉRÉ/.test(n.role) ? "⚙ " : "";
    t.textContent = (ICONES[n.genre] || "") + gen + coupe(n.titre, 26);
    const s = el("text", { class: "sous", x: ext ? 18 : 13, y: 37 }, g);
    s.textContent = coupe(n.role || (n.documente ? n.desc.split("\n")[0] : "— sans description —"), 36);
    if (!["make", "ext", "données", "dossier", "bin"].includes(n.genre)) {
      const k = el("text", { class: "genre", x: W - 9, y: 16 }, g); k.textContent = n.genre; }
    const tt = el("title", {}, g); tt.textContent = n.id + (n.role ? "\n" + n.role : "");
    g.addEventListener("mouseenter", () => { etat.survol = n; maj(); });
    g.addEventListener("mouseleave", () => { etat.survol = null; maj(); });
    g.addEventListener("click", e => { e.stopPropagation(); choisis(n); });
  }
}
function dessineLiens() {
  repartit(); gLiens.innerHTML = "";
  for (const l of liens) {
    if (!typesActifs.has(l.type)) { l.p = null; continue; }
    const p = el("path", { class: "lien " + l.type, d: chemin(l), stroke: css("--l-" + l.type),
      "marker-end": `url(#fl-${l.type})` }, gLiens);
    const tt = el("title", {}, p);
    tt.textContent = `${l.s.titre}  —${NOMS_TYPES[l.type]}→  ${l.c.titre}` + (l.label ? `\n${l.label}` : "") +
      (l.auto ? "\n(trouvé dans le code)" : "\n(décrit dans modele.py)");
    l.p = p;
  }
}

// ---------------------------------------------------------------- surbrillance
function voisins(n) {
  const s = new Set([n.id]);
  for (const l of [...n.sort, ...n.entre]) if (typesActifs.has(l.type)) { s.add(l.s.id); s.add(l.c.id); }
  return s;
}
function maj() {
  const focusNoeud = etat.survol || etat.choisi;
  let foyer = null, liensForts = new Set();
  gBadges.innerHTML = ""; gTrace.innerHTML = ""; gEtiq.innerHTML = "";
  if (etat.parcours) {
    const et = etat.parcours.etapes; foyer = new Set(et.map(e => e.noeud));
    if (focusNoeud && etat.survol) voisins(focusNoeud).forEach(x => foyer.add(x));
    // trace pointillée d'une étape à la suivante + numéros
    for (let i = 0; i + 1 < et.length; i++) {
      const a = parId.get(et[i].noeud), b = parId.get(et[i + 1].noeud); if (a === b) continue;
      el("path", { class: "trace-parcours", d: `M${a.x + W / 2},${a.y + H / 2} L${b.x + W / 2},${b.y + H / 2}` }, gTrace);
    }
    const dejas = new Map();
    et.forEach((e, i) => { const n = parId.get(e.noeud); const k = dejas.get(n.id) || 0; dejas.set(n.id, k + 1);
      const b = el("g", { class: "badge", transform: `translate(${n.x - 6 + k * 24},${n.y - 6})` }, gBadges);
      el("circle", { r: 11, ...(i === etat.etape ? { stroke: css("--texte"), "stroke-width": 2.5 } : {}) }, b);
      el("text", {}, b).textContent = i + 1; });
    for (const l of liens) if (foyer.has(l.s.id) && foyer.has(l.c.id)) liensForts.add(l);
  } else if (focusNoeud) {
    foyer = voisins(focusNoeud);
    for (const l of [...focusNoeud.sort, ...focusNoeud.entre]) liensForts.add(l);
  } else if (etat.recherche) {
    const q = sansAccent(etat.recherche);
    foyer = new Set(D.noeuds.filter(n => sansAccent(n.id + " " + n.titre + " " + n.role).includes(q)).map(n => n.id));
  }
  for (const n of D.noeuds) {
    n.g.classList.toggle("terne", !!foyer && !foyer.has(n.id));
    n.g.classList.toggle("choisi", etat.choisi === n);
    n.g.classList.toggle("trouve", !!etat.recherche && !focusNoeud && !etat.parcours && foyer?.has(n.id));
  }
  for (const l of liens) { if (!l.p) continue;
    const fort = liensForts.has(l);
    l.p.classList.toggle("fort", fort);
    l.p.classList.toggle("terne", !!foyer && !fort);
    if (fort && focusNoeud && !etat.parcours && l.label) {        // étiquettes des liens du nœud survolé
      const t = el("text", { class: "etiquette-lien" }, gEtiq);
      const mid = l.p.getPointAtLength(l.p.getTotalLength() / 2);
      t.setAttribute("x", mid.x); t.setAttribute("y", mid.y - 4); t.setAttribute("text-anchor", "middle");
      t.textContent = l.label;
    }
  }
}

// ---------------------------------------------------------------- vue (déplacer, zoomer)
const vue = { x: 0, y: 0, k: 1 };
function applique() { monde.setAttribute("transform", `translate(${vue.x},${vue.y}) scale(${vue.k})`); }
function toutVoir() {
  const r = svg.getBoundingClientRect(), lw = voies.length * VOIE + MARGE, lh = hauteurMax + 30;
  vue.k = Math.min(r.width / lw, r.height / lh, 1.2);
  vue.x = (r.width - lw * vue.k) / 2; vue.y = 8; applique();
}
function centre(n) {
  const r = svg.getBoundingClientRect(); vue.k = Math.max(vue.k, .85);
  vue.x = r.width / 2 - (n.x + W / 2) * vue.k; vue.y = r.height / 2 - (n.y + H / 2) * vue.k; applique();
}
svg.addEventListener("wheel", e => { e.preventDefault();
  const r = svg.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const f = Math.exp(-e.deltaY * .0015), k = Math.min(3, Math.max(.2, vue.k * f));
  vue.x = mx - (mx - vue.x) * k / vue.k; vue.y = my - (my - vue.y) * k / vue.k; vue.k = k; applique(); }, { passive: false });
let glisse = null;
svg.addEventListener("mousedown", e => { glisse = { x: e.clientX, y: e.clientY, vx: vue.x, vy: vue.y, bouge: false };
  document.getElementById("vue").classList.add("glisse"); });
window.addEventListener("mousemove", e => { if (!glisse) return;
  const dx = e.clientX - glisse.x, dy = e.clientY - glisse.y; if (Math.abs(dx) + Math.abs(dy) > 3) glisse.bouge = true;
  vue.x = glisse.vx + dx; vue.y = glisse.vy + dy; applique(); });
window.addEventListener("mouseup", () => { document.getElementById("vue").classList.remove("glisse");
  setTimeout(() => glisse = null, 0); });
svg.addEventListener("click", () => { if (glisse?.bouge) return; if (etat.choisi && !etat.parcours) { etat.choisi = null; panneauAccueil(); maj(); } });

// ---------------------------------------------------------------- panneau
const panneau = document.getElementById("panneau");
function puce(n, extra = "") {
  return `<span class="puce" data-id="${echappe(n.id)}"><span class="groupe-pastille" style="background:${css("--g-" + n.voie.id)}"></span>${echappe(n.titre)}${extra ? ` <small>${echappe(extra)}</small>` : ""}</span>`;
}
function branchePuces() {
  panneau.querySelectorAll(".puce[data-id]").forEach(p => p.addEventListener("click", () => {
    const n = parId.get(p.dataset.id); choisis(n); centre(n); }));
  panneau.querySelectorAll("[data-parcours]").forEach(b => b.addEventListener("click", () => ouvreParcours(+b.dataset.parcours)));
}
function choisis(n) {
  if (glisse?.bouge) return;
  if (etat.parcours) { const i = etat.parcours.etapes.findIndex(e => e.noeud === n.id); if (i >= 0) { etat.etape = i; panneauParcours(); maj(); return; } }
  etat.parcours = null; etat.choisi = n; maj();
  const groupes = (liste, noms, autre) => {
    const par = {}; for (const l of liste) (par[l.type] ||= []).push(l);
    return D.types.filter(t => par[t]).map(t => `<h3>${noms[t]} (${par[t].length})</h3>` +
      par[t].map(l => puce(autre(l), l.label)).join("")).join("");
  };
  const dansParcours = D.parcours.map((p, i) => [p, i]).filter(([p]) => p.etapes.some(e => e.noeud === n.id));
  panneau.innerHTML = `
    <div class="chemin"><span class="groupe-pastille" style="background:${css("--g-" + n.voie.id)}"></span>${echappe(n.voie.titre)} · ${echappe(n.genre)}</div>
    <h2>${echappe(n.titre)}</h2>
    <div class="chemin">${echappe(n.id)}</div>
    ${n.role ? `<div class="role">${echappe(n.role)}</div>` : ""}
    ${n.lien ? `<a href="${n.lien}">Ouvrir dans VS Code</a>` : ""}
    ${n.desc ? `<h3>Description</h3><pre>${echappe(n.desc)}</pre>` : n.documente ? "" : `<p class="avert">Sans description : ajouter une docstring / un commentaire d'en-tête, ou un rôle dans doc/carte/modele.py.</p>`}
    ${groupes(n.sort, SORTANT, l => l.c)}
    ${groupes(n.entre, ENTRANT, l => l.s)}
    ${n.sort.length + n.entre.length === 0 ? "<h3>Liens</h3><p>Aucun lien connu.</p>" : ""}
    ${dansParcours.length ? "<h3>Dans les parcours</h3><div class='liste-parcours'>" + dansParcours.map(([p, i]) =>
      `<button data-parcours="${i}">${echappe(p.titre)}</button>`).join("") + "</div>" : ""}
    <p style="margin-top:24px"><button class="btn" id="retour">← Accueil</button></p>`;
  panneau.querySelector("#retour").addEventListener("click", () => { etat.choisi = null; panneauAccueil(); maj(); });
  branchePuces();
}
function ouvreParcours(i) { etat.parcours = D.parcours[i]; etat.etape = 0; etat.choisi = null; panneauParcours(); maj();
  centre(parId.get(etat.parcours.etapes[0].noeud)); }
function panneauParcours() {
  const p = etat.parcours;
  panneau.innerHTML = `<div class="chemin">Parcours</div><h2>${echappe(p.titre)}</h2><p>${echappe(p.explication)}</p>
    <div class="nav"><button class="btn" id="prec">◀ Précédent</button><button class="btn" id="suiv">Suivant ▶</button>
    <button class="btn" id="quitte">✕ Quitter</button></div>
    <ol class="etapes">${p.etapes.map((e, i) => { const n = parId.get(e.noeud);
      return `<li data-i="${i}" class="${i === etat.etape ? "courante" : ""}"><b>${echappe(n.titre)}</b><span>${echappe(e.texte)}</span></li>`; }).join("")}</ol>`;
  const va = i => { etat.etape = Math.max(0, Math.min(p.etapes.length - 1, i)); panneauParcours(); maj(); centre(parId.get(p.etapes[etat.etape].noeud)); };
  panneau.querySelector("#prec").onclick = () => va(etat.etape - 1);
  panneau.querySelector("#suiv").onclick = () => va(etat.etape + 1);
  panneau.querySelector("#quitte").onclick = () => { etat.parcours = null; panneauAccueil(); maj(); };
  panneau.querySelectorAll(".etapes li").forEach(li => li.onclick = () => va(+li.dataset.i));
}
function panneauAccueil() {
  const m = D.meta;
  panneau.innerHTML = `
    <h2>Comment lire la carte</h2>
    <p>Chaque carte est un fichier (ou un outil, un dossier, une commande <code>make</code>), rangé dans la colonne de sa
    partie du projet. Les flèches disent <b>qui lance qui</b>, <b>qui lit / écrit quoi</b>, <b>qui inclut / importe quoi</b>.
    Survolez une carte pour isoler ses voisins, cliquez pour le détail ; ⚙ = fichier généré, pointillés = sans description.</p>
    <h3>Parcours pas à pas</h3>
    <div class="liste-parcours">${D.parcours.map((p, i) => `<button data-parcours="${i}">${echappe(p.titre)}<small>${echappe(p.explication)}</small></button>`).join("")}</div>
    <h3>Mise à jour</h3>
    <p>Regénérée par <code>make carte</code> et à chaque commit (hook installé par <code>make carte-hook</code>).
    Fichiers, descriptions, imports, includes et cibles make sont lus dans le code ; ce que les scripts écrivent,
    les rôles et les parcours sont dans <code>doc/carte/modele.py</code>.</p>
    <p class="chemin">Générée le ${echappe(m.date)}${m.commit ? " · dernier commit " + echappe(m.commit) : ""} ·
    ${D.noeuds.length} nœuds, ${liens.length} liens</p>
    ${m.a_documenter.length ? `<h3>À documenter (${m.a_documenter.length})</h3>` + m.a_documenter.map(id => puce(parId.get(id))).join("") : ""}
    ${m.avertissements.length ? `<h3>Incohérences de modele.py</h3>` + m.avertissements.map(a => `<p class="avert">${echappe(a)}</p>`).join("") : ""}`;
  branchePuces();
}

// ---------------------------------------------------------------- en-tête
const legende = document.getElementById("legende");
for (const t of D.types) {
  if (!liens.some(l => l.type === t)) continue;
  const b = document.createElement("button");
  b.innerHTML = `<span class="pastille" style="background:${css("--l-" + t)}"></span>${NOMS_TYPES[t]}`;
  b.title = "Afficher / masquer ces liens";
  if (!typesActifs.has(t)) b.classList.add("off");
  b.onclick = () => { typesActifs.has(t) ? typesActifs.delete(t) : typesActifs.add(t); b.classList.toggle("off"); dessineLiens(); maj(); };
  legende.appendChild(b);
}
document.getElementById("meta").textContent = `généré ${D.meta.date}`;
document.getElementById("recentrer").onclick = toutVoir;
const rech = document.getElementById("recherche");
rech.addEventListener("input", () => { etat.recherche = rech.value.trim(); maj(); });
rech.addEventListener("keydown", e => { if (e.key === "Enter") {
  const q = sansAccent(rech.value.trim()); const n = D.noeuds.find(n => sansAccent(n.id + " " + n.titre + " " + n.role).includes(q));
  if (n) { choisis(n); centre(n); } } });
window.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== rech) { e.preventDefault(); rech.focus(); }
  if (e.key === "Escape") { etat.choisi = null; etat.parcours = null; etat.recherche = ""; rech.value = ""; rech.blur(); panneauAccueil(); maj(); }
  if (etat.parcours && (e.key === "ArrowRight" || e.key === "ArrowLeft") && document.activeElement !== rech) {
    etat.etape = Math.max(0, Math.min(etat.parcours.etapes.length - 1, etat.etape + (e.key === "ArrowRight" ? 1 : -1)));
    panneauParcours(); maj(); centre(parId.get(etat.parcours.etapes[etat.etape].noeud)); }
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { marqueurs(); dessineVoies(); dessineNoeuds(); dessineLiens(); maj(); });

marqueurs(); dessineVoies(); dessineNoeuds(); dessineLiens(); panneauAccueil(); maj(); toutVoir();
window.addEventListener("resize", toutVoir);
// Liens directs : carte.html#n=cpp/cnn.cpp (un nœud) ou #p=0 (un parcours, numéroté depuis 0)
function depuisAdresse() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith("n=") && parId.has(h.slice(2))) { const n = parId.get(h.slice(2)); choisis(n); centre(n); }
  else if (h.startsWith("p=") && D.parcours[+h.slice(2)]) ouvreParcours(+h.slice(2));
}
window.addEventListener("hashchange", depuisAdresse); depuisAdresse();
</script>
</body>
</html>
